komga:
  database:
    file: "file:database?mode=memory"
  tasks-db:
    file: "file:tasks?mode=memory"
  sessions-db:
    file: "file:sessions?mode=memory"
  cors.allowed-origins:
    - http://localhost:8081
    - http://localhost:3000
    - http://localhost:8085
    - http://localhost:4173
    - https://komga.org
  oauth2-account-creation: false
  config-dir: ${rootDir}/config-dir
  jdbc-session-enabled: true
logging:
  level:
    org.apache.activemq.audit.message: WARN
    org.gotson.komga: DEBUG
#    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
#    reactor.netty.http.client: DEBUG
#    org.jooq: DEBUG
#    org.jooq.tools.LoggerListener: DEBUG
#    web: DEBUG
#    com.zaxxer.hikari: DEBUG
#    org.springframework.boot.autoconfigure: DEBUG
#    org.springframework.security.web.FilterChainProxy: DEBUG
#    org.springframework.security.web.authentication.rememberme: DEBUG
#    org.springframework.boot.context.config.ConfigDataEnvironment: TRACE
#    org.springframework.boot.context.config.ConfigDataEnvironmentPostProcessor: TRACE
    # Logs the SQL query execution (INSERT, UPDATE, DELETE)
#    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    # Logs query parameter values bound to SQL statements
#    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    # Optional: Logs Spring Session JDBC operations specifically
#    org.springframework.session.jdbc: DEBUG
#    org.springframework.session: TRACE
  logback:
    rollingpolicy:
      max-history: 1
springdoc:
  cache:
    disabled: true

server:
  port: 8080
#  servlet:
#    context-path: /komga
