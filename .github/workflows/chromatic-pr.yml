name: Chromatic for pull requests

on:
  pull_request:
    paths:
      - 'next-ui/**'
      - '!next-ui/i18n/*'
    branches:
      - 'master'

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    environment: chromatic
    steps:
      # from https://www.chromatic.com/docs/github-actions/#recommended-configuration-for-build-events
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.ref }}
          CHROMATIC_SLUG: ${{ github.repository }}

      - name: NextUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: next-ui

      - name: i18n:compile
        working-directory: next-ui
        run: npm run i18n:compile

      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          workingDir: next-ui
          exitOnceUploaded: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          skip: 'dependabot/**'

      - name: Summary
        run: |
          echo "Chromatic:" >> $GITHUB_STEP_SUMMARY
          echo "- [Build](${{ steps.chromatic.outputs.buildUrl }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Storybook](${{ steps.chromatic.outputs.storybookUrl }})" >> $GITHUB_STEP_SUMMARY
